name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Run TypeScript type checking - Client
        run: npm run type-check -w client

      - name: Run TypeScript type checking - API
        run: npm run type-check -w api

      - name: Run linting - Client
        continue-on-error: true
        run: npm run lint -w client

      - name: Run linting - API
        continue-on-error: true
        run: npm run lint -w api

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build Client
        run: npm run build -w client

      - name: Build API
        run: npm run build -w api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            client/dist
            api/dist
          retention-days: 5

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Run Client tests
        run: npm run test -w client

      - name: Run API tests
        run: npm run test -w api

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: false
          tags: task-tracker-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: false
          tags: task-tracker-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, build, test]
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          echo "✅ Lint & Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          if [ "${{ needs.lint-and-type-check.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            exit 1
          fi
