apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-client
  namespace: capstone
  labels:
    app: capstone-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-client
  template:
    metadata:
      labels:
        app: capstone-client
    spec:
      containers:
      - name: web
        image: 891612576490.dkr.ecr.us-east-1.amazonaws.com/capstone-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: capstone-client
  namespace: capstone
  labels:
    app: capstone-client
spec:
  type: LoadBalancer
  selector:
    app: capstone-client
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
