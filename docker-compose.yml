services:
  # MongoDB database
  mongo:
    image: mongo:7.0-jammy
    container_name: task-tracker-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    networks:
      - task-tracker-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express API server
  api:
    container_name: task-tracker-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4001:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://admin:password@mongo:27017/task-tracker?authSource=admin
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - task-tracker-network
    volumes:
      - ./api/src:/app/src
      - /app/node_modules
    command: npm start
    restart: unless-stopped

  # Nginx server (serves landing page and React app, proxies API)
  web:
    container_name: task-tracker-web
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - task-tracker-network
    restart: unless-stopped

networks:
  task-tracker-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
